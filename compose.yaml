services:
  saas-control-postgres:
    image: postgres:17-alpine
    container_name: chenrun-saas-control-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      # Local development credentials only.
      # Never reuse them outside this compose stack.
      POSTGRES_DB: saas_control
      POSTGRES_USER: chenrun_local
      POSTGRES_PASSWORD: chenrun_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chenrun_local -d saas_control"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - saas_control_postgres_data:/var/lib/postgresql/data

volumes:
  saas_control_postgres_data:
    name: chenrun_saas_control_postgres_data
